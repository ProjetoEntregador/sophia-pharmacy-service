services:
  pharmacy-postgres:
    env_file:
      - .env
    image: postgres:16
    container_name: pharmacy-postgres
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - pharmacy_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./logs:/var/log/postgresql
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h "
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=5s"
    networks:
      - net1

  pharmacy-service:
    build: .
    env_file:
      - .env
    container_name: pharmacy-service
    depends_on:
      - pharmacy-postgres
    ports:
      - "8080:8080"
    environment:
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_USERNAME: ${MAIL_SENDER_USERNAME}
      MAIL_PASSWORD: ${MAIL_APP_PASSWORD}
      MEDICATION_URL: ${MEDICATION_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: always
    networks:
      - net1

  pharmacy-postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: pharmacy-postgres-exporter
    depends_on:
      - pharmacy-postgres
    environment:
      DATA_SOURCE_NAME: "postgresql://sophia-admin:gvjvlntm@pharmacy-postgres:5432/pharmacy_db?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yml"
    volumes:
      - ./postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml
    command:
      - "--no-collector.stat_replication"
    networks:
      - net1

  pharmacy-backup-service:
    image: postgres:16
    container_name: pharmacy-backup-service
    depends_on:
      - pharmacy-postgres
    environment:
      POSTGRES_HOST: pharmacy-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: pharmacy_db
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh
      - ./scripts/restore.sh:/scripts/restore.sh
    entrypoint: >
      bash -c "
      chmod +x /scripts/backup.sh &&
      chmod +x /scripts/restore.sh &&
      while true; do
        /scripts/backup.sh;
        sleep 86400;
      done
      "
    networks:
      - net1

  pharmacy-maintenance-service:
    image: postgres:16
    container_name: pharmacy-maintenance-service
    depends_on:
      - pharmacy-postgres
    environment:
      POSTGRES_HOST: pharmacy-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: pharmacy_db
      LOG_RETENTION_DAYS: 7
    volumes:
      - ./scripts/maintenance.sh:/scripts/maintenance.sh
      - ./logs:/postgres-logs
    entrypoint: >
      bash -c "
      chmod +x /scripts/maintenance.sh &&
      while true; do
        /scripts/maintenance.sh;
        sleep 604800;
      done
      "
    networks:
      - net1

  pharmacy-promtail:
    image: grafana/promtail:2.9.8
    container_name: pharmacy-promtail
    volumes:
      - ./logs:/var/log/postgresql:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - net1

networks:
  net1:
    external: true
    name: net1

volumes:
  pharmacy_postgres_data:
